# Knox Ambience: a native Project Viewpoint shader pack (MIT, github.com/milkingoats/knox-ambience).
# Builds on Viewpoint's own Default look and adds one cheap full-screen pass at the end.

name=Knox Ambience
author=Knox Ambience
description=Cozy, lived-in Knox County: soft warm light, rain fog, and dark nights where lamps \
and flashlights glow warm against the dark. Built on Viewpoint's Default look.
base=default

options=knoxFogStrength knoxFogHaze knoxHorizonBlend knoxRainFog knoxAdaptation knoxLightSpill knoxLampHalo knoxSunGlow knoxSkyFill knoxAoBounce knoxRim knoxShadowLift knoxClarity knoxNightDarkness knoxLightFalloff knoxNightNeutral \
knoxStyle knoxExposure knoxSunlight knoxSaturation knoxContrast knoxHighlights knoxWarmth knoxGoldenHour knoxWindowGlow knoxVignette knoxRainGloom \
bounceStrength bounceReach flashBounce lampShadows nightColour volumetrics knoxDebug

option.knoxFogStrength.label=Distance fog
option.knoxFogStrength.tooltip=How far distance fog can go. Below 1 keeps skylines and distant buildings as soft silhouettes instead of a solid wall.
option.knoxFogStrength.range=0.3 1 0.05
option.knoxFogStrength.default=0.75

option.knoxFogHaze.label=Distance haze
option.knoxFogHaze.tooltip=Thickness of the general haze over distance, relative to Viewpoint's.
option.knoxFogHaze.range=0 1.5 0.05
option.knoxFogHaze.default=0.5

option.knoxHorizonBlend.label=Horizon blend
option.knoxHorizonBlend.tooltip=Distant land fades into the real sky colour just above it: into the sunset by day, into the dark sky at night. 0 turns it off.
option.knoxHorizonBlend.range=0 1 0.05
option.knoxHorizonBlend.default=0.5

option.knoxRainFog.label=Rain fog
option.knoxRainFog.tooltip=Extra grey fog while it rains, closer the harder it rains. 0 turns it off.
option.knoxRainFog.range=0 2 0.1
option.knoxRainFog.default=1.0

option.knoxAdaptation.label=Night vision
option.knoxAdaptation.tooltip=Lift shadows and mid-tones at night, like eyes adjusted to the dark. Lamps keep their punch and the sky is left alone. 0 turns it off.
option.knoxAdaptation.range=0 1 0.05
option.knoxAdaptation.default=0.35

option.knoxLightSpill.label=Light spill
option.knoxLightSpill.tooltip=Lit doorways, lamps and windows spill soft light into the dark around them, so an unlit room next to a lit one isn't pitch black. 0 turns it off.
option.knoxLightSpill.range=0 1.5 0.05
option.knoxLightSpill.default=0.5
option.knoxLightSpill.preset.potato=0
option.knoxLightSpill.preset.low=0.3

option.knoxLampHalo.label=Lamp halos
option.knoxLampHalo.tooltip=At night, a soft warm halo around the brightest lights (lamps, lit windows, fires). 0 turns it off.
option.knoxLampHalo.range=0 1.5 0.05
option.knoxLampHalo.default=0.5
option.knoxLampHalo.preset.potato=0
option.knoxLampHalo.preset.low=0.3

option.knoxSunGlow.label=Sun glow
option.knoxSunGlow.tooltip=By day, a soft glare around the sun and the clouds it lights, spilling over rooftops and trees. Golden at sunrise and sunset. 0 turns it off. Classic grade only.
option.knoxSunGlow.range=0 1.5 0.05
option.knoxSunGlow.default=0.35
option.knoxSunGlow.preset.potato=0
option.knoxSunGlow.preset.low=0.3

option.knoxSkyFill.label=Sky fill
option.knoxSkyFill.tooltip=By day, shaded ground and roofs take a little of the sky's colour, and shaded walls a little warm light bounced off the sunlit ground. 0 turns it off.
option.knoxSkyFill.range=0 1.5 0.05
option.knoxSkyFill.default=0.3
option.knoxSkyFill.preset.potato=0

option.knoxAoBounce.label=Coloured corners
option.knoxAoBounce.tooltip=Corners and creases take on the surface's colour, so a brick corner reads deep red instead of grey. Colour only, and subtle: Viewpoint already colours and brightens corners itself, so this is off by default. 0 turns it off.
option.knoxAoBounce.range=0 1 0.05
option.knoxAoBounce.default=0
option.knoxAoBounce.preset.potato=0

option.knoxRim.label=Rim light
option.knoxRim.tooltip=Edges turning away from you catch a faint sky and sun light, so shapes stand out from the background. 0 turns it off.
option.knoxRim.range=0 1 0.05
option.knoxRim.default=0
option.knoxRim.preset.potato=0

option.knoxShadowLift.label=Shadow lift
option.knoxShadowLift.tooltip=Keep a faint floor under the darkest shadows so shapes stay readable. 0 allows pure black.
option.knoxShadowLift.range=0 1 0.05
option.knoxShadowLift.default=0.2

option.knoxClarity.label=Clarity
option.knoxClarity.tooltip=A little local contrast so surfaces read crisp. Eased off at night and in the distance. 0 turns it off.
option.knoxClarity.range=0 1 0.05
option.knoxClarity.default=0.15
option.knoxClarity.preset.potato=0
option.knoxClarity.preset.low=0.15

option.knoxNightDarkness.label=Night darkness
option.knoxNightDarkness.tooltip=How much darker nights get on top of Viewpoint's own night.
option.knoxNightDarkness.range=0 1 0.05
option.knoxNightDarkness.default=0

option.knoxLightFalloff.label=Light falloff
option.knoxLightFalloff.tooltip=At night, darken dim areas harder than lit ones so lamp and flashlight pools stand out. Classic grade only.
option.knoxLightFalloff.range=0 1 0.05
option.knoxLightFalloff.default=0

option.knoxNightNeutral.label=Neutral nights
option.knoxNightNeutral.tooltip=Drain colour out of dark areas and nights so the dark reads grey instead of blue or purple. Warm light keeps its colour. Classic grade only.
option.knoxNightNeutral.range=0 1 0.05
option.knoxNightNeutral.default=0.5

option.knoxStyle.label=Grade style
option.knoxStyle.tooltip=Classic: the original Knox grade. Natural: reworked colour maths, contrast and saturation on lightness and chroma only (no hue drift), one white balance instead of stacked warm tints, no grey veil at night (night colour comes from Viewpoint's Night colour shift). Compare both against the Default pack.
option.knoxStyle.values=classic natural
option.knoxStyle.value.classic=Classic
option.knoxStyle.value.natural=Natural
option.knoxStyle.default=natural

option.knoxExposure.label=Knox exposure
option.knoxExposure.tooltip=Natural grade only. Overall brightness of the scene (not the sky) after Viewpoint's own exposure. Below 1 is darker and cozier.
option.knoxExposure.range=0.7 1.2 0.01
option.knoxExposure.default=0.93

option.knoxSunlight.label=Sunlight
option.knoxSunlight.tooltip=Natural grade only. By day, sunlit surfaces get brighter while shade stays dark, like stronger sun: lighter without losing contrast. 0 turns it off.
option.knoxSunlight.range=0 0.6 0.05
option.knoxSunlight.default=0.2

option.knoxSaturation.label=Knox saturation
option.knoxSaturation.tooltip=Applied after Viewpoint's own grade. Below 1 gives the muted overcast look.
option.knoxSaturation.range=0.4 1.2 0.05
option.knoxSaturation.default=0.9

option.knoxContrast.label=Knox contrast
option.knoxContrast.tooltip=Applied after Viewpoint's own grade. 1 leaves it unchanged.
option.knoxContrast.range=0.8 1.3 0.05
option.knoxContrast.default=1.08

option.knoxHighlights.label=Soften highlights
option.knoxHighlights.tooltip=Pull bright skies and pale roads down so they keep detail instead of washing out. 0 turns it off.
option.knoxHighlights.range=0 1 0.05
option.knoxHighlights.default=0.3

option.knoxWarmth.label=Warmth
option.knoxWarmth.tooltip=Warm light and slightly cool shadows, a soft warm cast by day, and warm lamp and flashlight pools at night.
option.knoxWarmth.range=0 1 0.05
option.knoxWarmth.default=0.35

option.knoxGoldenHour.label=Golden hour
option.knoxGoldenHour.tooltip=At sunrise and sunset, the sky and sunlit surfaces turn rose-gold while shadows stay cool. 0 turns it off.
option.knoxGoldenHour.range=0 1.5 0.05
option.knoxGoldenHour.default=0.45

option.knoxWindowGlow.label=Window glow
option.knoxWindowGlow.tooltip=At night, lit windows, lamps and fires glow brighter and more golden against the dark. 0 turns it off. Classic grade only.
option.knoxWindowGlow.range=0 1.5 0.05
option.knoxWindowGlow.default=0.6

option.knoxVignette.label=Vignette
option.knoxVignette.tooltip=Gently darkens the screen edges to frame the view. 0 turns it off.
option.knoxVignette.range=0 0.6 0.05
option.knoxVignette.default=0.25

option.knoxRainGloom.label=Rain gloom
option.knoxRainGloom.tooltip=Dimmer light while it rains.
option.knoxRainGloom.range=0 0.6 0.05
option.knoxRainGloom.default=0.3

option.knoxDebug.label=Knox debug view
option.knoxDebug.tooltip=Bars shows four bars at the top: Viewpoint's night, the pack's night, rain, wetness. Depth shows distance (near world and distant world, dark near to white far); sky is red. Normals shows surface directions as colour (floors green). Occlusion shows Viewpoint's ambient occlusion. Edges shows in red where the pack leaves edges alone to stop shimmer. Gamma ramp shows two grey ramps: if the top one looks evenly stepped, our input is display values; if the bottom one does, it is linear light. Over 1.0 shows in red where the input is brighter than white (HDR). Light buffer shows Viewpoint's light buffer. Colourfulness shows how saturated each pixel is (grey none, blue mild, yellow strong, red very strong).
option.knoxDebug.values=off bars depth normals occlusion edges ramp over light chroma
option.knoxDebug.value.off=Off
option.knoxDebug.value.bars=Uniform bars
option.knoxDebug.value.depth=Depth
option.knoxDebug.value.normals=Normals
option.knoxDebug.value.occlusion=Occlusion
option.knoxDebug.value.edges=Edges
option.knoxDebug.value.ramp=Gamma ramp
option.knoxDebug.value.over=Over 1.0
option.knoxDebug.value.light=Light buffer
option.knoxDebug.value.chroma=Colourfulness
option.knoxDebug.default=off

# Viewpoint options inherited from the built-in packs, with Knox Ambience defaults. Same ids, so
# these replace the inherited definitions (they must also be named in options= above, or the
# inherited definition wins); the rest of each block is written for this pack.
# More bounce light so lit rooms spill into the rooms next to them, more shadowed lamps so less
# light leaks through walls, a weaker night colour shift so nights read silver, not violet, and
# volumetric light off.

option.bounceStrength.label=Global illumination strength
option.bounceStrength.tooltip=How much light bounces off lit surfaces onto nearby walls and floors. Higher lets a lit room brighten the rooms beside it.
option.bounceStrength.range=0 3 0.05
option.bounceStrength.default=1.5

option.bounceReach.label=Global illumination reach (squares)
option.bounceReach.tooltip=How far bounced light travels. Further reaches into neighbouring rooms and costs a little more.
option.bounceReach.values=3 6 9 12
option.bounceReach.default=9

option.flashBounce.label=Flashlight global illumination strength
option.flashBounce.tooltip=How much a flashlight's beam lights up the room around what it hits.
option.flashBounce.range=0 3 0.05
option.flashBounce.default=1.5

option.lampShadows.label=Lamp shadows (nearest lamps)
option.lampShadows.tooltip=How many of the nearest lamps cast shadows. Lamps without shadows shine through walls; more costs GPU time.
option.lampShadows.values=0 2 4 6 8
option.lampShadows.default=4
option.lampShadows.preset.potato=0
option.lampShadows.preset.low=2
option.lampShadows.preset.high=6
option.lampShadows.preset.ultra=8

option.nightColour.label=Night colour shift
option.nightColour.tooltip=How blue the dark turns, like eyes at night. Knox Ambience keeps it low so nights read silver rather than violet.
option.nightColour.range=0 2 0.05
option.nightColour.default=0.3

# Off by default: from OldPoint's overhead camera, Viewpoint's volumetric light breaks into soft white
# dotted blobs on floors and walls that move with the camera (seen 2026-10-31). Players who stay in
# first person can turn it back on for lamp halos, the flashlight beam and dust.
option.volumetrics.label=Volumetric light
option.volumetrics.tooltip=Light in the air: haze over distance, lamp halos, the flashlight's beam, dust indoors. Knox Ambience turns it off by default, because from the overhead camera (OldPoint) it breaks up into moving white blobs.
option.volumetrics.default=false
option.volumetrics.preset.potato=false
option.volumetrics.preset.low=false

# Bloom pyramid: the glow pass seeds a quarter-size target from the brightest lights (and the sun
# by day), eased over frames; three downsample passes halve it to 1/8, 1/16 and 1/32. The grade
# adds the levels back together for spill, halos and sun glow. All small: about 0.1 ms in total.
targets=knoxGlow knoxBloom8 knoxBloom16 knoxBloom32
target.knoxGlow=rgba16f 0.25 history
target.knoxBloom8=rgba16f 0.125
target.knoxBloom16=rgba16f 0.0625
target.knoxBloom32=rgba16f 0.03125

passes=knoxGlow knoxDown8 knoxDown16 knoxDown32 knoxGrade
pass.knoxGlow.stage=final
pass.knoxGlow.fragment=knox_glow.frag
pass.knoxGlow.inputs=color depth farDepth knoxGlow.previous
pass.knoxGlow.target=knoxGlow
pass.knoxDown8.stage=final
pass.knoxDown8.fragment=knox_down8.frag
pass.knoxDown8.inputs=knoxGlow
pass.knoxDown8.target=knoxBloom8
pass.knoxDown16.stage=final
pass.knoxDown16.fragment=knox_down16.frag
pass.knoxDown16.inputs=knoxBloom8
pass.knoxDown16.target=knoxBloom16
pass.knoxDown32.stage=final
pass.knoxDown32.fragment=knox_down32.frag
pass.knoxDown32.inputs=knoxBloom16
pass.knoxDown32.target=knoxBloom32
pass.knoxGrade.stage=final
pass.knoxGrade.fragment=knox_grade.frag
pass.knoxGrade.inputs=color depth farDepth normal albedo occlusion light knoxGlow knoxBloom8 knoxBloom16 knoxBloom32
