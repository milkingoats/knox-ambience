plugins {
    id 'java'
}

// Paths come from gradle.properties or the command line:
//   gradlew install -PpzJar=/path/to/projectzomboid.jar -PzbJar=/path/to/ZombieBuddy.jar
def pzJar = findProperty('pzJar')
def zbJar = findProperty('zbJar')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Both jars are provided at run time by the game and by ZombieBuddy, so compile against them only.
    // Skip them when missing, so tasks that do not compile (for example `wrapper`) still work.
    if (zbJar) compileOnly files(zbJar)
    if (pzJar) compileOnly files(pzJar)
}

// Fail with a clear message only when we actually compile.
tasks.named('compileJava') {
    doFirst {
        if (!pzJar || !zbJar) throw new GradleException('Set pzJar and zbJar (see README.md)')
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    // The perf-test mode is a separate mod (mods/KnoxAmbienceTest) so "before" runs can load it
    // without Knox Ambience's patches. It is built here to keep one build command.
    autotest {
        java {
            srcDirs = ['../../KnoxAmbienceTest/java/src']
        }
    }
}

configurations {
    autotestCompileOnly.extendsFrom compileOnly
}

tasks.named('compileAutotestJava') {
    doFirst {
        if (!pzJar || !zbJar) throw new GradleException('Set pzJar and zbJar (see README.md)')
    }
}

// The shader pack ships inside the jar; ShaderPackInstall copies it into viewpoint-shaderpacks at startup.
// The index lists its files, because a class loader can't list a folder.
def shaderPackDir = file("${projectDir}/../../../shaderpacks/KnoxAmbience")
def shaderPackIndexDir = layout.buildDirectory.dir('generated/shaderpack')

tasks.register('shaderPackIndex') {
    inputs.dir(shaderPackDir)
    outputs.dir(shaderPackIndexDir)
    doLast {
        def lines = fileTree(shaderPackDir).files
                .collect { shaderPackDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
                .sort()
        def out = shaderPackIndexDir.get().file('shaderpack/KnoxAmbience.index').asFile
        out.parentFile.mkdirs()
        out.text = lines.join('\n') + '\n'
    }
}

jar {
    archiveBaseName.set('KnoxAmbience')
    archiveVersion.set('')
    from(shaderPackDir) { into 'shaderpack/KnoxAmbience' }
    from(tasks.named('shaderPackIndex'))
}

tasks.register('autotestJar', Jar) {
    from sourceSets.autotest.output
    archiveBaseName.set('KnoxAmbienceTest')
    archiveVersion.set('')
}

tasks.register('installAutotest', Copy) {
    dependsOn autotestJar
    from autotestJar.archiveFile
    into "${projectDir}/../../KnoxAmbienceTest/42/media/java"
}

tasks.register('install', Copy) {
    dependsOn jar, installAutotest
    from jar.archiveFile
    into "${projectDir}/../42/media/java"
}
